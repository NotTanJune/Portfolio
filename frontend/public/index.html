    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph. The image filename is versioned: change it whenever the image changes so crawler caches refetch. -->

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Screenprint-style portrait of Tanmay Nargas on a mustard background, labeled AI Engineer, MS AI at NTU, Singapore." />
    <meta property="og:url" content="https://tanmaynargas.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->

    <meta name="twitter:creator" content="@nottanjune" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tanmay Nargas",
        "url": "https://tanmaynargas.com/",
        "image": "https://tanmaynargas.com/og/og-v2.jpg",
        "jobTitle": "AI Engineer",

        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Nanyang Technological University" },
          { "@type": "CollegeOrUniversity", "name": "Manipal Institute of Technology" }
        ],
        "sameAs": [

          "https://x.com/nottanjune"
        ]
      }

    <!-- Preload the primary font (highest-priority text asset) to cut FOUT -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin.woff2" crossorigin="anonymous" />


    <style>
      /* Declared here (not in webpack-processed CSS) so the stable /fonts/ URL
         is used verbatim and matches the preload link above. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/fonts/bricolage-grotesque-latin.woff2') format('woff2');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      /* Fallback stack stays sans-serif so the swap to Bricolage Grotesque
         doesn't jump from serif metrics (reduces layout shift / FOUT jar). */
      body,
      body.font-loading,
      body.font-loaded {
        font-family: 'Bricolage Grotesque', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif;
      }
    </style>
